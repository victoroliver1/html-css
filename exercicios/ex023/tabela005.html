<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícíos de Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 500px;
            border-collapse: collapse;

        }

        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;
        }

        col.cnome{
            background-color: gray;
        }

        col.csexo{
            background-color: aqua;
        }

        col.cidade{
            background-color: burlywood;
        }

        col.cprofissão{
            background-color: chocolate;
        }
    </style>
</head>
<body>
    
    <table>

        <colgroup>
        <col class="cnome">
        <col class="csexo">
        <col class="cidade">
        <col class="cprofissão">

        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">idaded</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25 anos</td>
            <td>Jornalista</td>
        </tr>

         <tr>
            <td>Cláudio</td>
            <td>M</td>
            <td>28 anos</td>
            <td>Programador</td>
        </tr>

         <tr>
            <td>Otávio</td>
            <td>M</td>
            <td>35 anos</td>
            <td>Mecânico</td>
        </tr>

         <tr>
            <td>Hélio</td>
            <td>M</td>
            <td>31 anos</td>
            <td>Vendedor</td>
        </tr>

         <tr>
            <td>Maria</td>
            <td>F</td>
            <td>23 anos</td>
            <td>Médica</td>
        </tr>

         <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>45 anos</td>
            <td>Professor</td>
        </tr>
    </table>
</body>
</html>
